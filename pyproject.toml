[project]
name = "dq7-tablet-trader"
version = "0.1.0"
description = "Tablet manager for Dragon Quest VII (3DS) saves"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "flet==1.0.4",
    "flet-desktop==1.0.4",
    "platformdirs>=4.13.5",
    "send2trash>=2.1.0",
]

[project.scripts]
dq7tt = "dq7tt.cli:main"
dq7tt-gui = "dq7tt_gui.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dq7tt", "dq7tt_gui"]
include = ["dq7tt/data/*.json"]

[dependency-groups]
dev = [
    "fonttools>=4.67.0",
    "pillow>=13.0.0",
    "pyinstaller>=6.22.3",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
