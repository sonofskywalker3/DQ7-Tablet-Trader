[project]
name = "dq7-tablet-trader"
version = "0.1.0"
description = "Tablet manager for Dragon Quest VII (3DS) saves"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "platformdirs>=4.13.5",
    "send2trash>=2.1.0",
]

[project.scripts]
dq7tt = "dq7tt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dq7tt"]
include = ["dq7tt/data/*.json"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
